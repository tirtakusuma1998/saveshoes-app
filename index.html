<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAVESHOES App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1d4ed8; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbz0WAl-ReqRielNPiqGXOwO8_IiYIGwhCFumD-x8VPDBDNRMUw6V2IG01ITPpwrMdBb/exec" 
    allow="clipboard-read; clipboard-write; camera; microphone; geolocation">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    window.addEventListener("message", function(event) {
      if (event.data && event.data.tipe === "BUKA_WA") {
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
          window.location.href = event.data.urlApp;
        } else {
          window.open(event.data.urlWeb, "_blank", "noopener,noreferrer");
        }
      }
    });
  </script>
</body>
</html>
